<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PokePlay Overlay</title>
<style>
  /* OBS Browser Source: http://127.0.0.1:8765 (1920 x 1080).
     The right-hand column beside the game: Twitch chat, then her team, ending above her avatar. */
  :root {
    --bg: rgba(14, 18, 28, 0.92);
    --edge: rgba(255, 255, 255, 0.10);
    --text: #f2f4f8;
    --muted: #9aa4b8;
    --accent: #ffcb3d;
    --hp-good: #3ddc84;
    --hp-mid: #ffb02e;
    --hp-low: #ff5a5f;
  }
  html, body { margin: 0; background: transparent; color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  .wrap { position: absolute; top: 12px; right: 12px; width: 444px; height: 714px; overflow: hidden;
    display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--bg); border: 1px solid var(--edge); border-radius: 14px; padding: 12px 18px; box-sizing: border-box; }
  .status { flex: none; padding: 10px 18px; position: relative; }
  /* During a boss fight this covers the status card, so nothing else on stream has to move. */
  .boss { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; padding: 10px 18px; box-sizing: border-box; text-align: center; background: #0e121c; border-radius: 13px;
    border: 3px solid var(--tone); --tone: var(--accent); }
  .boss.on { display: flex; }
  .boss.fight { animation: boss-pulse 1.4s ease-in-out infinite; }
  .boss.won { --tone: var(--hp-good); }
  .boss.lost { --tone: var(--hp-low); }
  .boss-tag { font-size: 16px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--tone); }
  .boss-title { font-size: 36px; font-weight: 700; line-height: 1.12; overflow-wrap: anywhere; }
  .boss-detail { font-size: 20px; color: var(--muted); }
  @keyframes boss-pulse { 0%, 100% { box-shadow: inset 0 0 0 0 transparent; } 50% { box-shadow: inset 0 0 26px 2px var(--tone); } }
  /* The empty corner left of the subtitles, under the game: x 12-292, y 974-1072. */
  .catchup { position: absolute; left: 12px; bottom: 8px; width: 280px; height: 98px; padding: 8px 14px; overflow: hidden; }
  .catchup-tag { font-size: 13px; line-height: 16px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .catchup-head { font-size: 18px; line-height: 22px; font-weight: 600; max-height: 44px; overflow: hidden; }
  .catchup-nums { font-size: 14px; line-height: 18px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; }
  .status-top .tag { color: var(--accent); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
  .status-top .nums { color: var(--muted); white-space: nowrap; }
  .status-top .nums b { color: var(--text); }
  .where { margin-top: 4px; font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .goal { margin-top: 2px; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #feed { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--edge); height: 84px; overflow: hidden; }
  #feed .row { display: flex; gap: 8px; height: 21px; font-size: 15px; line-height: 21px; }
  #feed .time { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
  #feed .text { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .label { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  #chat { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
    font-size: 20px; line-height: 1.3; }
  #chat .msg { flex: none; margin-top: 6px; overflow-wrap: anywhere; }
  #chat .who { font-weight: 700; margin-right: 8px; }
  #chat .note { color: var(--muted); }
  .team { flex: none; }
  #team { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 64px; gap: 4px 16px; min-height: 200px; align-content: start; }
  .empty { grid-column: 1 / 3; color: var(--muted); font-size: 18px; }
  .mon { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .mon img { flex: none; width: 64px; height: 64px; image-rendering: pixelated; }
  .mon .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .mon .name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mon .lv { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mon .hp { height: 6px; background: rgba(255,255,255,.14); border-radius: 4px; overflow: hidden; }
  .mon .hp > div { height: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card status">
    <div class="status-top">
      <span class="tag">AI experiment</span>
      <span class="nums"><b id="badges">0/8</b> badges · <b id="record">0–0</b> won–lost</span>
    </div>
    <div class="where" id="where">&nbsp;</div>
    <div class="goal" id="goal">Getting started</div>
    <div id="feed"></div>
    <div class="boss" id="boss">
      <div class="boss-tag" id="boss-tag"></div>
      <div class="boss-title" id="boss-title"></div>
      <div class="boss-detail" id="boss-detail"></div>
    </div>
  </div>
  <div class="card chat">
    <div class="label">Twitch chat</div>
    <div id="chat"><div class="msg note" id="chat-note">Chat will appear here</div></div>
  </div>
  <div class="card team">
    <div class="label">Team</div>
    <div id="team"></div>
  </div>
</div>
<div class="card catchup" id="catchup" hidden>
  <div class="catchup-tag" id="catchup-tag"></div>
  <div class="catchup-head" id="catchup-head"></div>
  <div class="catchup-nums" id="catchup-nums"></div>
</div>
<script>
  // Twitch chat, read-only and anonymous. It only draws messages here: chat never reaches the AI.
  const MAX_MESSAGES = 40;
  const chatBox = document.getElementById("chat"), team = document.getElementById("team");
  let chatChannel = "", chatSocket = null, shownTeam = null, shownFeed = null;

  function parseIrc(raw) {
    const tags = {};
    let rest = raw;
    if (rest[0] === "@") {
      const end = rest.indexOf(" ");
      for (const pair of rest.slice(1, end).split(";")) {
        const eq = pair.indexOf("=");
        tags[pair.slice(0, eq)] = pair.slice(eq + 1);
      }
      rest = rest.slice(end + 1);
    }
    let prefix = "";
    if (rest[0] === ":") {
      const end = rest.indexOf(" ");
      prefix = rest.slice(1, end);
      rest = rest.slice(end + 1);
    }
    const split = rest.indexOf(" :");
    const head = split >= 0 ? rest.slice(0, split) : rest;
    return { tags, login: prefix.split("!")[0], command: head.split(" ")[0], text: split >= 0 ? rest.slice(split + 2) : "" };
  }

  function addMessage(id, login, name, color, text) {
    document.getElementById("chat-note")?.remove();
    const row = document.createElement("div");
    row.className = "msg"; row.dataset.id = id; row.dataset.login = login;
    const who = document.createElement("span");
    who.className = "who"; who.textContent = name; who.style.color = color || "var(--accent)";
    row.append(who, document.createTextNode(text));
    chatBox.append(row);
    while (chatBox.children.length > MAX_MESSAGES) chatBox.firstChild.remove();
  }

  function handleChatLine(line) {
    if (!line) return;
    if (line.startsWith("PING")) { chatSocket?.send(line.replace("PING", "PONG")); return; }
    const m = parseIrc(line);
    if (m.command === "PRIVMSG") {
      const action = m.text.match(/^\x01ACTION (.*)\x01$/);
      addMessage(m.tags.id || "", m.login, m.tags["display-name"] || m.login, m.tags.color, action ? action[1] : m.text);
    } else if (m.command === "CLEARMSG") {          // a mod deleted one message
      chatBox.querySelectorAll(".msg").forEach(r => { if (r.dataset.id === m.tags["target-msg-id"]) r.remove(); });
    } else if (m.command === "CLEARCHAT") {         // a mod timed out / banned someone, or cleared chat
      chatBox.querySelectorAll(".msg").forEach(r => { if (!m.text || r.dataset.login === m.text) r.remove(); });
    }
  }

  function connectChat() {
    if (!chatChannel) return;
    const socket = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
    chatSocket = socket;
    socket.onopen = () => {
      socket.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
      socket.send("NICK justinfan" + Math.floor(10000 + Math.random() * 80000));
      socket.send("JOIN #" + chatChannel);
    };
    socket.onmessage = e => String(e.data).split("\r\n").forEach(handleChatLine);
    socket.onclose = () => { if (socket === chatSocket) setTimeout(connectChat, 5000); };
  }

  function hpColor(f) { return f > 0.5 ? "var(--hp-good)" : f > 0.2 ? "var(--hp-mid)" : "var(--hp-low)"; }

  function renderTeam(party) {
    if (!party.length) {
      const empty = document.createElement("div");
      empty.className = "empty"; empty.textContent = "No team yet";
      team.replaceChildren(empty);
      return;
    }
    team.replaceChildren(...party.slice(0, 6).map(m => {
      const f = m.max_hp ? m.hp / m.max_hp : 0;
      const row = document.createElement("div"); row.className = "mon";
      row.innerHTML = '<img alt=""><div class="info"><span class="name"></span><span class="lv"></span><div class="hp"><div></div></div></div>';
      if (m.sprite) row.querySelector("img").src = m.sprite;
      row.querySelector(".name").textContent = m.name;
      row.querySelector(".lv").textContent = "Lv " + m.level + (m.status ? " · " + m.status : "");
      const hp = row.querySelector(".hp > div"); hp.style.width = (f * 100) + "%"; hp.style.background = hpColor(f);
      return row;
    }));
  }

  function renderShow(s) {
    const box = document.getElementById("catchup"), up = s.catch_up;
    box.hidden = !up;
    if (up) {
      document.getElementById("catchup-tag").textContent = up.tag;
      document.getElementById("catchup-head").textContent = up.headline;
      document.getElementById("catchup-nums").textContent = up.numbers;
    }
    const banner = document.getElementById("boss"), boss = s.boss;
    banner.className = boss ? "boss on " + boss.state : "boss";
    if (boss) {
      document.getElementById("boss-tag").textContent = boss.tag;
      document.getElementById("boss-title").textContent = boss.title;
      document.getElementById("boss-detail").textContent = boss.detail;
    }
  }

  function renderStatus(s) {
    renderShow(s);
    const stats = s.stats || {};
    document.getElementById("badges").textContent = (s.badges || 0) + "/8";
    document.getElementById("record").textContent = (stats.won || 0) + "–" + (stats.lost || 0);
    document.getElementById("where").textContent = s.location || " ";
    document.getElementById("goal").textContent = s.goal ? "Goal: " + s.goal : "Working out what to do next";
    const feedJson = JSON.stringify(s.feed || []);
    if (feedJson === shownFeed) return;
    shownFeed = feedJson;
    document.getElementById("feed").replaceChildren(...(s.feed || []).map(item => {
      const row = document.createElement("div"); row.className = "row";
      const time = document.createElement("span"); time.className = "time"; time.textContent = item.time;
      const text = document.createElement("span"); text.className = "text"; text.textContent = item.text;
      row.append(time, text);
      return row;
    }));
  }

  async function refresh() {
    try {
      const s = await (await fetch("/state.json", { cache: "no-store" })).json();
      renderStatus(s);
      const partyJson = JSON.stringify(s.party || []);
      if (partyJson !== shownTeam) { shownTeam = partyJson; renderTeam(s.party || []); }
      if (s.twitch_channel && s.twitch_channel !== chatChannel) {
        chatChannel = s.twitch_channel;
        if (chatSocket) { const old = chatSocket; chatSocket = null; old.close(); }
        connectChat();
      }
    } catch (e) { /* agent not running yet */ }
  }
  setInterval(refresh, 500);
  refresh();
</script>
</body>
</html>
