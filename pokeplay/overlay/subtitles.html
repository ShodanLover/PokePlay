<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PokePlay Subtitles</title>
<style>
  /* OBS Browser Source: http://127.0.0.1:8765/subtitles  (1920 x 1080, just below the Avatar in the Sources list).
     A bar along the bottom that stops before her avatar's corner, so nothing overlaps. */
  :root { --bg: #0e121c; --text: #f2f4f8; --accent: #ffcb3d; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  .bar { position: absolute; left: 0; right: 320px; bottom: 0; height: 150px; box-sizing: border-box;
    padding: 0 40px 0 48px; display: flex; align-items: center; gap: 32px;
    background: var(--bg); border-top: 3px solid var(--accent);
    font-family: "Segoe UI", system-ui, sans-serif; color: var(--text); }
  .name { flex: none; font-size: 28px; font-weight: 700; color: var(--accent); }
  .line { flex: 1; min-width: 0; max-height: 122px; overflow: hidden; font-size: 38px; font-weight: 600; line-height: 1.25;
    opacity: 0; transition: opacity .2s ease; }
  .line.on { opacity: 1; }
</style>
</head>
<body>
<div class="bar"><span class="name" id="name"></span><div class="line" id="line"></div></div>
<script>
  const MAX_FONT = 38, MIN_FONT = 24, MAX_HEIGHT = 122;
  const line = document.getElementById("line"), nameEl = document.getElementById("name");
  let current = "";

  function fit() {                  // long lines shrink to stay inside the bar
    let size = MAX_FONT;
    line.style.fontSize = size + "px";
    while (line.scrollHeight > MAX_HEIGHT && size > MIN_FONT) {
      size -= 2;
      line.style.fontSize = size + "px";
    }
  }

  async function refresh() {
    try {
      const s = await (await fetch("/state.json", { cache: "no-store" })).json();
      nameEl.textContent = s.streamer || "";
      const text = s.subtitle || "";
      if (text !== current) {
        current = text;
        if (text) { line.textContent = text; fit(); }
        line.classList.toggle("on", !!text);
      }
    } catch (e) { /* agent not running */ }
  }
  setInterval(refresh, 150);
</script>
</body>
</html>
