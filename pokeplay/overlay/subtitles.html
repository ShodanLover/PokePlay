<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PokePlay Subtitles</title>
<style>
  /* OBS Browser Source: http://127.0.0.1:8765/subtitles  (1920 x 1080).
     A box centered at the bottom of the screen, below the game and clear of her avatar's corner. */
  :root { --bg: rgba(14, 18, 28, 0.92); --text: #f2f4f8; --accent: #ffcb3d; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  .box { position: absolute; left: 304px; right: 304px; bottom: 8px; height: 90px; box-sizing: border-box;
    padding: 0 28px; display: flex; align-items: center; justify-content: center; text-align: center;
    background: var(--bg); border: 2px solid var(--accent); border-radius: 14px;
    font-family: "Segoe UI", system-ui, sans-serif; color: var(--text); }
  .line { max-height: 84px; overflow: hidden; font-size: 34px; font-weight: 600; line-height: 1.25;
    opacity: 0; transition: opacity .2s ease; }
  .line.on { opacity: 1; }
</style>
</head>
<body>
<div class="box"><div class="line" id="line"></div></div>
<script>
  const MAX_FONT = 34, MIN_FONT = 22, MAX_HEIGHT = 84;
  const line = document.getElementById("line");
  let current = "";

  function fit() {                  // long lines shrink to stay inside the box
    let size = MAX_FONT;
    line.style.fontSize = size + "px";
    while (line.scrollHeight > MAX_HEIGHT && size > MIN_FONT) {
      size -= 2;
      line.style.fontSize = size + "px";
    }
  }

  async function refresh() {
    try {
      const s = await (await fetch("/state.json", { cache: "no-store" })).json();
      const text = s.subtitle || "";
      if (text !== current) {
        current = text;
        if (text) { line.textContent = text; fit(); }
        line.classList.toggle("on", !!text);
      }
    } catch (e) { /* agent not running */ }
  }
  setInterval(refresh, 150);
</script>
</body>
</html>
