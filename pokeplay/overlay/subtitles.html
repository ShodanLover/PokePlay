<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PokePlay Subtitles</title>
<style>
  /* OBS Browser Source: http://127.0.0.1:8765/subtitles  (1920 x 1080, just below the Avatar in the Sources list).
     A bar along the bottom that stops before her avatar's corner, so nothing overlaps: her team on the left,
     her live subtitles on the right. */
  :root { --bg: #0e121c; --text: #f2f4f8; --muted: #9aa4b8; --accent: #ffcb3d;
          --hp-good: #3ddc84; --hp-mid: #ffb02e; --hp-low: #ff5a5f; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  .bar { position: absolute; left: 0; right: 320px; bottom: 0; height: 150px; box-sizing: border-box;
    padding: 0 40px 0 32px; display: flex; align-items: center; gap: 28px;
    background: var(--bg); border-top: 3px solid var(--accent);
    font-family: "Segoe UI", system-ui, sans-serif; color: var(--text); }
  .team { flex: none; width: 474px; display: grid; grid-template-columns: repeat(3, 150px); grid-auto-rows: 54px;
    gap: 8px 12px; align-content: center; }
  .empty { grid-column: 1 / 4; color: var(--muted); font-size: 18px; }
  .mon { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; align-content: center; row-gap: 5px; }
  .mon .name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mon .lv { font-size: 14px; color: var(--muted); align-self: center; white-space: nowrap; }
  .mon .hp { grid-column: 1 / 3; height: 7px; background: rgba(255,255,255,.14); border-radius: 4px; overflow: hidden; }
  .mon .hp > div { height: 100%; }
  .line { flex: 1; min-width: 0; max-height: 122px; overflow: hidden; font-size: 38px; font-weight: 600; line-height: 1.25;
    opacity: 0; transition: opacity .2s ease; }
  .line.on { opacity: 1; }
</style>
</head>
<body>
<div class="bar"><div class="team" id="team"></div><div class="line" id="line"></div></div>
<script>
  const MAX_FONT = 38, MIN_FONT = 22, MAX_HEIGHT = 122;
  const line = document.getElementById("line"), team = document.getElementById("team");
  let current = "", shownTeam = null;

  function fit() {                  // long lines shrink to stay inside the bar
    let size = MAX_FONT;
    line.style.fontSize = size + "px";
    while (line.scrollHeight > MAX_HEIGHT && size > MIN_FONT) {
      size -= 2;
      line.style.fontSize = size + "px";
    }
  }

  function hpColor(f) { return f > 0.5 ? "var(--hp-good)" : f > 0.2 ? "var(--hp-mid)" : "var(--hp-low)"; }

  function renderTeam(party) {
    if (!party.length) {
      const empty = document.createElement("div");
      empty.className = "empty"; empty.textContent = "No team yet";
      team.replaceChildren(empty);
      return;
    }
    team.replaceChildren(...party.slice(0, 6).map(m => {
      const f = m.max_hp ? m.hp / m.max_hp : 0;
      const row = document.createElement("div"); row.className = "mon";
      row.innerHTML = '<span class="name"></span><span class="lv"></span><div class="hp"><div></div></div>';
      row.querySelector(".name").textContent = m.name;
      row.querySelector(".lv").textContent = "Lv " + m.level + (m.status ? " · " + m.status : "");
      const hp = row.querySelector(".hp > div"); hp.style.width = (f * 100) + "%"; hp.style.background = hpColor(f);
      return row;
    }));
  }

  async function refresh() {
    try {
      const s = await (await fetch("/state.json", { cache: "no-store" })).json();
      const partyJson = JSON.stringify(s.party || []);
      if (partyJson !== shownTeam) { shownTeam = partyJson; renderTeam(s.party || []); }
      const text = s.subtitle || "";
      if (text !== current) {
        current = text;
        if (text) { line.textContent = text; fit(); }
        line.classList.toggle("on", !!text);
      }
    } catch (e) { /* agent not running */ }
  }
  setInterval(refresh, 150);
</script>
</body>
</html>
