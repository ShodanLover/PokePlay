# PokePlay settings. Copy this file to config.toml and edit it.

[emulator]
host = "127.0.0.1"
port = 8888               # must match PORT in lua/pokeplay_bridge.lua
autosave_minutes = 10     # make an mGBA save state this often (0 = off)
autosave_slot = 9         # mGBA save state slot 1-9

[brain]
ollama_url = "http://127.0.0.1:11434"
# qwen3:4b fits easily on a 6 GB card (GTX 1660 / 1660 Ti) alongside OBS.
# If you have more VRAM free, try "qwen3:8b" for smarter play.
model = "qwen3:4b"
temperature = 0.75       # higher = more random and creative, lower = more sensible
context_tokens = 4096
# She chooses her own name and personality on first launch and saves them in persona.json.
# Delete persona.json if you ever want her to reinvent herself.
streamer_name = ""                  # leave empty to let her choose (recommended)
max_seconds_between_thoughts = 7    # the most she stands still before thinking again (she doesn't always speak)
obsession = ""                      # an occasional running joke, e.g. a sports star (empty = none)
news_feeds = []                     # RSS feed links for real headlines she occasionally remarks on (empty = none)
persona_hint = "a female AI streamer with a dry, offbeat sense of humor who gets a little unhinged when things go wrong"   # used once, when she invents herself
# How she talks, in your own words. Leave empty for the built-in style
# (casual, dry humor, no "I'm so chaotic!", no asterisk actions, no forced catchphrases).
speaking_style = ""
memory_file = "memory.json"         # everything she has learned (keep it safe!)
persona_file = "persona.json"

[voice]
# "windows" = built-in Windows voice (nothing to install)
# "piper"   = free neural voice that sounds much better (see README)
# "none"    = no voice, text on the overlay only
engine = "windows"
piper_model = ""          # e.g. "voices/en_US-lessac-medium.onnx" when engine = "piper"
rate = 1                  # Windows voice speed, -10 (slow) to 10 (fast)
gender = "female"         # Windows voice: "female" or "male"
volume = 85               # her voice volume, 0-100
voice_name = ""           # pick a specific Windows voice; see: python -m pokeplay --list-voices
kokoro_voice = "af_heart" # when engine = "kokoro" (the most natural free voices)
speed = 1.0               # Kokoro speaking speed
wait_for_voice = true     # finish talking before choosing the next action

[overlay]
port = 8765               # OBS Browser Source URL: http://127.0.0.1:8765
twitch_channel = ""       # your Twitch channel name, to show chat on the overlay
chat_replies = false      # true = she answers viewers out loud (chat never affects her game decisions)

[commentary]
enabled = true            # react out loud to battles, level ups, etc.
min_seconds_between = 6
max_silence_seconds = 8    # if she's been quiet this long, she thinks out loud about what's going on
